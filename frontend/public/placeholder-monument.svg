<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2522"/>
      <stop offset="50%" stop-color="#3D322C"/>
      <stop offset="100%" stop-color="#1F1A18"/>
    </linearGradient>
    <linearGradient id="archGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7C4927" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGradient)"/>

  <!-- Subtle Architectural Pattern Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Monument Silhouette Vector -->
  <g transform="translate(250, 110)">
    <!-- Base Platform -->
    <rect x="0" y="240" width="300" height="15" rx="3" fill="#C5A059" opacity="0.4"/>
    <rect x="20" y="225" width="260" height="15" rx="2" fill="#C5A059" opacity="0.5"/>

    <!-- Left Minaret/Pillar -->
    <rect x="30" y="70" width="16" height="155" fill="url(#archGradient)"/>
    <polygon points="38,40 25,70 51,70" fill="#C5A059" opacity="0.8"/>
    <circle cx="38" cy="35" r="4" fill="#C5A059"/>

    <!-- Right Minaret/Pillar -->
    <rect x="254" y="70" width="16" height="155" fill="url(#archGradient)"/>
    <polygon points="262,40 249,70 275,70" fill="#C5A059" opacity="0.8"/>
    <circle cx="262" cy="35" r="4" fill="#C5A059"/>

    <!-- Central Structure -->
    <rect x="65" y="100" width="170" height="125" fill="url(#archGradient)"/>

    <!-- Central Dome -->
    <path d="M 115 100 C 115 45, 185 45, 185 100 Z" fill="#C5A059" opacity="0.85"/>
    <polygon points="150,15 145,45 155,45" fill="#C5A059"/>
    <circle cx="150" cy="10" r="3" fill="#C5A059"/>

    <!-- Grand Archway -->
    <path d="M 120 225 L 120 150 C 120 120, 180 120, 180 150 L 180 225 Z" fill="#1F1A18" opacity="0.8"/>

    <!-- Left Sub-Arch -->
    <path d="M 80 225 L 80 175 C 80 160, 105 160, 105 175 L 105 225 Z" fill="#1F1A18" opacity="0.7"/>

    <!-- Right Sub-Arch -->
    <path d="M 195 225 L 195 175 C 195 160, 220 160, 220 175 L 220 225 Z" fill="#1F1A18" opacity="0.7"/>
  </g>

  <!-- Labels -->
  <text x="400" y="405" font-family="serif, Georgia, 'Times New Roman'" font-size="18" font-weight="bold" fill="#FBF8F3" text-anchor="middle" letter-spacing="2">
    HISTORIC HERITAGE SITE
  </text>
  <text x="400" y="430" font-family="sans-serif, Arial" font-size="12" fill="#D6D3D1" text-anchor="middle" letter-spacing="1" opacity="0.75">
    Photograph Pending Verification • OpenStreetMap Record
  </text>
</svg>

